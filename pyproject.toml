[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "page-crawler"
version = "0.2.0"
description = "Small asynchronous HTML crawler"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.12,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "selectolax>=0.4,<0.5",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.12,<0.14",
  "testcontainers[postgres]>=4.14,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["page_crawler"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["page_crawler"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
